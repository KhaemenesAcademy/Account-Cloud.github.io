<!doctype html>
<meta charset="utf-8">
<title>Account Cloud v0.1.1 Contract Self-Test</title>
<pre id="out">Running…</pre>
<script>
(async()=>{
  const paths=[
    "../schemas/adult-account.schema.json",
    "../schemas/family.schema.json",
    "../schemas/family-access.schema.json",
    "../schemas/learner.schema.json",
    "../schemas/learner-progress.schema.json",
    "../schemas/course-state.schema.json",
    "../schemas/session-view.schema.json",
    "../schemas/sync-envelope.schema.json"
  ];
  const rows=[];
  for(const path of paths){
    try{
      const response=await fetch(path,{cache:"no-store"});
      const schema=await response.json();
      rows.push([path,response.ok && !!schema.$schema && !!schema.title]);
    }catch{
      rows.push([path,false]);
    }
  }
  try{
    const manifest=await fetch("../capsule-manifest.json",{cache:"no-store"}).then(r=>r.json());
    rows.push(["../capsule-manifest.json",manifest.packageVersion==="0.1.1" && manifest.sourceMarker==="🟣" && manifest.realAccountData===false]);
  }catch{ rows.push(["../capsule-manifest.json",false]); }
  try{
    const version=(await fetch("../VERSION",{cache:"no-store"}).then(r=>r.text())).trim();
    rows.push(["../VERSION",version==="0.1.1"]);
  }catch{ rows.push(["../VERSION",false]); }
  const pass=rows.every(([,ok])=>ok);
  document.getElementById("out").textContent=
    (pass?"PASS":"FAIL")+"\n\n"+
    rows.map(([path,ok])=>`${ok?"PASS":"FAIL"} · ${path}`).join("\n");
})();
</script>
