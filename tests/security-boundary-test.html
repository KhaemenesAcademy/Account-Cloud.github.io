<!doctype html><meta charset="utf-8"><title>Account Cloud v0.2 Security Boundary Test</title><pre id="out">Running…</pre><script>
(async()=>{const rows=[],client=await fetch("../assets/account-cloud-client.js",{cache:"no-store"}).then(r=>r.text()),ui=await fetch("../assets/account-cloud-ui.js",{cache:"no-store"}).then(r=>r.text()),config=await fetch("../assets/account-cloud-config.example.js",{cache:"no-store"}).then(r=>r.text());rows.push(["client has no localStorage/sessionStorage",!/localStorage|sessionStorage/.test(client)]);rows.push(["UI has no localStorage/sessionStorage",!/localStorage|sessionStorage/.test(ui)]);rows.push(["UI avoids innerHTML",!/\.innerHTML\s*=/.test(ui)]);rows.push(["HTTP transport uses redirect:error",client.includes('redirect:"error"')]);rows.push(["HTTP transport uses no-referrer",client.includes('referrerPolicy:"no-referrer"')]);rows.push(["client explicitly discards role metadata",client.includes("Deliberately ignore role/roles/metadata")]);rows.push(["production data disabled in example",config.includes("productionDataAllowed: false")]);const pass=rows.every(([,ok])=>ok);document.getElementById("out").textContent=(pass?"PASS":"FAIL")+"\n\n"+rows.map(([x,ok])=>`${ok?"PASS":"FAIL"} · ${x}`).join("\n")})();
